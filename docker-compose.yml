services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: graphops-falkordb
    ports:
      - "6379:6379" # FalkorDB Redis protocol
      - "3000:3000" # FalkorDB Web Browser interface
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

volumes:
  falkordb_data:
